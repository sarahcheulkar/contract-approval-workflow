[app_servers]
target_node ansible_host=localhost ansible_connection=local ansible_become=no

[app_servers:vars]
ansible_python_interpreter=/opt/homebrew/bin/python3
app_name=contract-approval-workflow
app_user=sarah
app_dir=/tmp/contract-workflow
app_port=8080
docker_image=shrutigupta/contract-workflow:1.0.0
docker_container=contract-workflow-container
rollback_image=shrutigupta/contract-workflow:1.0.0
