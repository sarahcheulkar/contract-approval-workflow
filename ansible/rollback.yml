---
- name: "Task 14: Automated Rollback & Recovery to Previous Stable Release (Shruti Gupta - 23102C0051)"
  hosts: app_servers
  gather_facts: no

  tasks:
    - name: "Step 1: Stop failing or unhealthy container"
      command: docker stop {{ docker_container }}
      register: stop_result
      failed_when: false
      changed_when: stop_result.rc == 0

    - name: "Step 2: Remove failing container instance"
      command: docker rm {{ docker_container }}
      register: rm_result
      failed_when: false
      changed_when: rm_result.rc == 0

    - name: "Step 3: Launch verified stable rollback container image"
      command: >
        docker run -d --name {{ docker_container }} -p {{ app_port }}:8080 {{ rollback_image }}
      register: rollback_run
      changed_when: rollback_run.rc == 0

    - name: "Step 4: Verify Rollback Recovery via Health Endpoint"
      uri:
        url: "http://localhost:{{ app_port }}/api/health"
        method: GET
        status_code: 200
        return_content: yes
      register: rollback_health
      until: rollback_health.status == 200
      retries: 6
      delay: 3

    - name: "Step 5: Confirm Service Recovery Success"
      debug:
        msg: "SUCCESS: Service recovered and operational on rollback image {{ rollback_image }}. Health: {{ rollback_health.json.status }}"
