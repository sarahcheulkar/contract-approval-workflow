server.port=8080
spring.application.name=contract-approval-workflow

# H2 In-Memory Database Configuration (zero external setup needed)
spring.datasource.url=jdbc:h2:mem:contractdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console for developer inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Health Endpoints for Docker & Ansible health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Contract Approval Workflow - Enterprise Edition
info.app.developer=Shruti Gupta (Roll No: 23102C0051)
info.app.version=1.0.0
